services:
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - app-net

  backend:
    image: ${DOCKER_IMAGE:-flask-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-backend
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    expose:
      - "5000"
    depends_on:
      - redis
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge